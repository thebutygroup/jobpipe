<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%23FFFFFF"/><path d="M16 26c0-7 2-12 9-15-1 8-3 13-9 15z" fill="%234CA366"/><path d="M16 26c0-5-1.5-9-7-11 .8 6 2.4 9.6 7 11z" fill="%232E7047"/></svg>'>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}jobpipe — the job you want finds you{% endblock %}</title>
<style>
/* ============================================================================
   DESIGN TOKENS — the single source of truth for the whole site.
   Change a value here and it propagates everywhere; no page defines its own
   colors. Active palette: "Fresh botanical" (light, organic, energetic).

   Alternative palettes — swap the :root values to retheme the entire site:

   Sage & cream:      --bg:#FAF9F5 --surface:#F3F1EA --ink:#2D3A31
                      --accent:#6B9E78 --accent-deep:#3E6849
                      --accent-soft:#E8F0E9 --highlight:#F5EDDA --warn:#C98A4B
   Warm terracotta:   --bg:#FBF7F2 --surface:#F5EDE4 --ink:#3D3229
                      --accent:#C4704B --accent-deep:#8E4A2E
                      --accent-soft:#F6E9E1 --highlight:#F2EFD9 --warn:#7A9E6B
   ========================================================================== */
:root{
  /* color */
  --bg:#FFFFFF;            /* page background */
  --surface:#F6F9F4;       /* cards, table headers, wells */
  --surface-2:#FFFFFF;     /* inputs, raised elements on surface */
  --ink:#1F2E24;           /* primary text */
  --ink-soft:#5B6B60;      /* secondary text */
  --line:#DCE7DA;          /* borders, dividers */
  --accent:#4CA366;        /* leaf green — links, buttons, focus */
  --accent-deep:#2E7047;   /* hover, emphasis, strong chips */
  --accent-soft:#E4F2E8;   /* tinted backgrounds, hover rows, good chips */
  --highlight:#FDF3D8;     /* honey — callouts, pending states */
  --warn:#B57E22;          /* honey deep — warnings, needs-attention (AA on white) */
  --danger:#C25B4E;        /* errors, rejections */
  --good:#2E7047;          /* success text */
  /* legacy aliases — older templates reference these names; they resolve to
     the tokens above so a palette change propagates everywhere. Prefer the
     new names in new code. */
  --text:var(--ink);
  --dim:var(--ink-soft);
  --panel:var(--surface);
  --det:var(--accent-deep);
  --hum:var(--warn);
  --bad:var(--danger);
  --ok:var(--good);
  --fg:var(--ink);
  /* type & shape */
  --font:"Avenir Next",Seravek,"Segoe UI",system-ui,sans-serif;
  --radius:10px;
  --radius-sm:7px;
  --shadow:0 1px 3px rgba(31,46,36,.07);
  --maxw:860px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);padding:0}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px 48px}
/* ---- header / nav ---------------------------------------------------------- */
header.site{border-bottom:1px solid var(--line);background:var(--bg)}
header.site .row{max-width:var(--maxw);margin:0 auto;padding:14px 20px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);
  font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand .leaf{width:22px;height:22px;flex:none}
nav.site a{color:var(--ink-soft);text-decoration:none;margin-left:16px;font-size:13.5px}
nav.site a:hover{color:var(--accent-deep)}
/* ---- typography ------------------------------------------------------------ */
h1{font-size:26px;line-height:1.25;margin:26px 0 6px;letter-spacing:-.01em}
h2{font-size:16.5px;margin-bottom:4px}
a{color:var(--accent-deep)}
a:hover{color:var(--accent)}
.meta{color:var(--ink-soft);font-size:13.5px;margin:2px 0 8px}
.sub{color:var(--ink-soft);font-size:14px;margin:22px 0 14px}
/* ---- cards ----------------------------------------------------------------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
/* ---- forms ----------------------------------------------------------------- */
input,select,textarea{background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink);padding:9px 11px;border-radius:var(--radius-sm);font-size:14.5px;
  font-family:inherit}
input::placeholder,textarea::placeholder{color:#9AAAA0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;
  border-color:var(--accent)}
button,.btn{background:var(--accent);color:#fff;border:none;padding:10px 18px;
  border-radius:999px;font-size:14.5px;font-weight:600;cursor:pointer;
  font-family:inherit;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:var(--accent-deep);color:#fff}
.btn-quiet{background:transparent;color:var(--accent-deep);border:1px solid var(--line)}
.btn-quiet:hover{background:var(--accent-soft);color:var(--accent-deep)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
.bar .on{font-weight:700;color:var(--accent-deep)}
/* ---- tables ---------------------------------------------------------------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden}
.tbl th{text-align:left;color:var(--ink-soft);font-size:11px;text-transform:uppercase;
  letter-spacing:.06em;padding:10px 10px;border-bottom:1px solid var(--line);
  background:var(--surface)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--accent-soft)}
.tbl a.plain{color:inherit}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line)}
th{color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
/* ---- score chips ------------------------------------------------------------ */
.score{display:inline-block;min-width:24px;text-align:center;padding:2px 8px;
  border-radius:999px;font-weight:700;font-size:12px;background:var(--surface);
  color:var(--ink-soft);border:1px solid var(--line)}
.score.s7,.score.s8{background:var(--accent-soft);color:var(--accent-deep);
  border-color:var(--accent)}
.score.s9,.score.s10{background:var(--accent-deep);color:#fff;border-color:var(--accent-deep)}
/* ---- status ----------------------------------------------------------------- */
ul{margin-left:18px;font-size:13.5px}
.good{color:var(--good);font-size:13.5px}
.flag{color:var(--warn);font-weight:600}
.bad{color:var(--danger);font-weight:600}
.alert{background:var(--highlight);border:1px solid var(--warn);border-radius:var(--radius);
  padding:12px 16px;margin:12px 0;font-size:14px}
.error{background:#F9E9E7;border:1px solid var(--danger);border-radius:var(--radius);
  padding:12px 16px;margin:12px 0;font-size:14px;color:var(--danger)}
.apply{display:inline-block;margin-top:8px;color:var(--accent-deep);font-size:13.5px;
  font-weight:600}
.empty{color:var(--ink-soft);padding:40px 0;text-align:center}
/* confirmation after an internal action — see dashboard/flash.py */
.flash{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-deep);
  border-radius:var(--radius);padding:10px 16px;margin:14px 0 0;font-size:14px;
  font-weight:600}
form.filter{margin-bottom:14px;font-size:13px;color:var(--ink-soft)}
/* ---- landing hero ------------------------------------------------------------ */
.hero{text-align:center;padding:44px 0 10px}
.hero h1{font-size:34px;margin:0 0 10px}
.hero .lede{color:var(--ink-soft);font-size:17px;max-width:540px;margin:0 auto 24px}
.quickstart{max-width:520px;margin:0 auto;text-align:left}
.quickstart input,.quickstart textarea{width:100%;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:18px 0}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:4px 12px;font-size:12.5px;color:var(--ink-soft)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;
  margin:20px 0}
/* ---- responsive tables ------------------------------------------------------- */
@media (max-width:719px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%;box-sizing:border-box}
  .tbl tr{border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;
    padding:6px 10px;background:var(--surface-2)}
  .tbl td{border:none;padding:4px 0}
  .tbl td[data-l]:not([data-l=""])::before{content:attr(data-l) " ";color:var(--ink-soft);
    font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
  .hero h1{font-size:27px}
}
</style>
</head>
<body>
<header class="site"><div class="row">
  <a class="brand" href="/">
    <svg class="leaf" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 27c0-8 2.3-13.6 10-17-1.1 9-3.4 14.7-10 17z" fill="var(--accent)"/><path d="M16 27c0-5.5-1.7-10-8-12.3.9 6.8 2.7 10.8 8 12.3z" fill="var(--accent-deep)"/></svg>
    jobpipe</a>
  <nav class="site">{% if not hide_internal_nav %}<a href="/queue">queue</a><a href="/all">all</a><a href="/applicants">applicants</a><a href="/stats">stats</a><a href="/sources">sources</a><a href="/health">health</a>{% else %}<a href="/onboard">sign up</a><a href="/go">my matches</a>{% endif %}</nav>
</div></header>
<div class="wrap">
{% if flash %}<div class="flash" role="status">{{ flash }}</div>{% endif %}
{% block content %}{% endblock %}
</div></body>
</html>
